<!doctype html>
<html lang="en">

<title>starter</title>

<script src="shared.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
#flow { height: 300px; }
.row { position: absolute; inset: 0; padding: 44px 48px; display: flex; align-items: center; }
.step { flex: 1; padding: 16px 18px 18px; min-height: 150px; }
.step .ds { margin-top: 6px; }
</style>
</head>
<body>
<div class="sheet">
<div class="item" id="flow">
  <div class="row">
    <div class="card step"><div class="nm">first</div><div class="ds">What happens first, in one short sentence.</div></div><i class="ar"></i>
    <div class="card step"><div class="nm">second</div><div class="ds">What follows.</div></div><i class="ar"></i>
    <div class="card on step"><div class="nm">result</div><div class="ds">What the reader ends up with.</div></div>
  </div>
</div>
</div>
</body>
